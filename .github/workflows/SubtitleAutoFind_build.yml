name: Build Subtitle Auto Find V7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/subtitle/autofind
          mkdir -p app/src/main/res/layout app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SubtitleAutoFind'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.subtitle.autofind'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.subtitle.autofind'
                  minSdk 24
                  targetSdk 28
                  versionCode 7
                  versionName '0.7-strict-match-sync-encoding'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Subtitle Auto Find</string>
              <string name="accessibility_desc">Caches the current DTV program title only when DVB EPG is unavailable. It does not automate Subtitle Player controls.</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="V7: resolves localized EPG names to the canonical English title, rejects unrelated subtitle files, improves EPG start-time parsing, and retries the initial auto-position after the subtitle has loaded. Manual Sync/seek remains available."
                  android:textSize="18sp"
                  android:paddingBottom="24dp" />

              <Button
                  android:id="@+id/autoFind"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="AUTO FIND" />

              <Button
                  android:id="@+id/accessibility"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Enable DTV title fallback" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="150"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Subtitle Auto Find"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DtvAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/subtitle/autofind/MainActivity.java <<'EOF'
          package com.subtitle.autofind;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.text.Normalizer;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.Calendar;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private TextView status;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private static final String SUB_PKG = "com.waellotfy.subtitleplayer";
              private static final String SUB_SERVICE = "com.waellotfy.subtitleplayer.SubtitleService";

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  status = findViewById(R.id.status);
                  Button auto = findViewById(R.id.autoFind);
                  Button access = findViewById(R.id.accessibility);
                  access.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  auto.setOnClickListener(v -> autoFind());
              }

              private void autoFind() {
                  status.setText("Reading DTV / EPG…");
                  new Thread(() -> {
                      try {
                          String current = get("http://127.0.0.1:9000/request?cmd=channel_current", 4000, 5000);
                          String epg = get("http://127.0.0.1:9000/request?cmd=epg", 4000, 6000);
                          String rawTitle = extractTitle(epg);

                          if (empty(rawTitle)) {
                              String serviceId = pick(current, "service_id", "serviceId", "serviceid");
                              String streamId  = pick(current, "stream_id", "streamId", "streamid");
                              String networkId = pick(current, "network_id", "networkId", "networkid");
                              String freq      = pick(current, "freq", "frequency");
                              String position  = pick(current, "position", "sat_position");
                              StringBuilder u = new StringBuilder("http://127.0.0.1:9000/request?cmd=epg");
                              if (serviceId != null) u.append("&service_id=").append(enc(serviceId));
                              if (streamId  != null) u.append("&stream_id=").append(enc(streamId));
                              if (networkId != null) u.append("&network_id=").append(enc(networkId));
                              if (freq      != null) u.append("&freq=").append(enc(freq));
                              if (position  != null) u.append("&position=").append(enc(position));
                              epg = get(u.toString(), 4000, 6000);
                              rawTitle = extractTitle(epg);
                          }

                          long elapsedMs = extractElapsed(epg);
                          long seen = getSharedPreferences("auto", MODE_PRIVATE).getLong("last_dtv_seen", 0);
                          String cached = getSharedPreferences("auto", MODE_PRIVATE).getString("last_dtv_title", null);
                          String cachedTime = getSharedPreferences("auto", MODE_PRIVATE).getString("last_dtv_time", null);

                          if (empty(rawTitle)) {
                              if (!empty(cached) && System.currentTimeMillis() - seen < 10L * 60L * 1000L) {
                                  rawTitle = cached;
                              }
                          }

                          // Some channels expose the current title through the DTV banner but not through the DVB JSON.
                          // In that case recover the start time from barEpgInfoNowTime / the visible INFO banner.
                          if (elapsedMs < 0 && System.currentTimeMillis() - seen < 10L * 60L * 1000L) {
                              elapsedMs = elapsedFromClockText(cachedTime);
                          }

                          if (empty(rawTitle)) {
                              fail("No current program title was found. If the channel has no EPG, press INFO in DTV once and enable DTV title fallback.");
                              return;
                          }

                          rawTitle = cleanTitle(rawTitle);
                          final String rawForUi = rawTitle;
                          ui("Detected: " + rawForUi + "\nResolving original title…");
                          String wikidataTitle = resolveViaWikidata(rawTitle);
                          String translatedTitle = translateToEnglish(rawTitle);
                          String cinemetaTitle = resolveViaCinemeta(wikidataTitle, translatedTitle, rawTitle);
                          String searchTitle = cleanTitle(firstNonEmpty(cinemetaTitle, wikidataTitle, translatedTitle, rawTitle));

                          ui("Detected: " + rawForUi + "\nEnglish/original title: " + searchTitle + "\nSearching Arabic subtitle…");
                          SubtitleMatch match = findBestSubtitle(searchTitle, rawTitle, wikidataTitle, translatedTitle, cinemetaTitle);
                          if (match == null) {
                              fail("No matching .srt file was found in the current subtitle archive for: " + searchTitle + ". Manual Search in the original app remains available.");
                              return;
                          }

                          String url = archiveUrl(match.fileName);
                          ui("Found: " + match.fileName + "\nLoading it through the original Subtitle Player…");
                          if (!sendToPatchedSubtitlePlayer(url)) {
                              fail("The original Subtitle Player rejected direct loading. Install SubtitlePlayer_V11_DIRECT_AUTO_SAFE.apk first, then try again.");
                              return;
                          }

                          final long pos = elapsedMs;
                          if (pos >= 0) {
                              // The Subtitle Player downloads/parses the SRT asynchronously. A seek sent too early
                              // is ignored because its subtitle list is still empty. Retry only during initial load,
                              // then stop so manual Seek/Sync remains fully under the user's control.
                              handler.postDelayed(() -> sendPosition(pos), 12000);
                              handler.postDelayed(() -> sendPosition(pos), 25000);
                          }

                          ui("Subtitle sent: " + match.fileName + "\nMatch confidence: " + match.score +
                             (pos >= 0 ? "\nAuto-position: " + formatMs(pos) + " (initial retries at 12s and 25s). Manual Sync/seek stays active." :
                                         "\nNo reliable start time was available, so use the original manual Sync/seek controls if needed."));

                      } catch (Exception e) {
                          fail("AUTO FIND error: " + safe(e.getMessage()));
                      }
                  }).start();
              }

              private boolean sendToPatchedSubtitlePlayer(String action) {
                  try {
                      Intent i = new Intent();
                      i.setComponent(new ComponentName(SUB_PKG, SUB_SERVICE));
                      i.setAction(action);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void sendPosition(long ms) {
                  if (ms < 0) return;
                  sendToPatchedSubtitlePlayer(Long.toString(ms));
              }

              private SubtitleMatch findBestSubtitle(String... queries) throws Exception {
                  String json = get("https://archive.org/metadata/mora.25r", 10000, 30000);
                  JSONObject root = new JSONObject(json);
                  JSONArray files = root.optJSONArray("files");
                  if (files == null) return null;

                  ArrayList<String> qs = new ArrayList<>();
                  if (queries != null) {
                      for (String q : queries) {
                          String n = norm(q);
                          if (!empty(n) && !qs.contains(n)) qs.add(n);
                      }
                  }
                  if (qs.isEmpty()) return null;

                  SubtitleMatch best = null;
                  for (int i=0;i<files.length();i++) {
                      JSONObject f = files.optJSONObject(i);
                      if (f == null) continue;
                      String name = f.optString("name", "");
                      if (!name.toLowerCase(Locale.ROOT).endsWith(".srt")) continue;
                      String n = norm(name.substring(0, name.length()-4));
                      int score = scoreMulti(n, name, qs);
                      if (score <= 0) continue;
                      if (best == null || score > best.score) best = new SubtitleMatch(name, score);
                  }
                  return best;
              }

              private static int scoreMulti(String fileNorm, String rawName, List<String> qs) {
                  int bestBase = 0;
                  for (int qi=0; qi<qs.size(); qi++) {
                      String q = qs.get(qi);
                      if (empty(q)) continue;
                      int s = 0;

                      // Never accept a subtitle only because it looks Arabic. The title itself must match first.
                      if (fileNorm.equals(q)) {
                          s = 2200;
                      } else if (containsPhrase(fileNorm, q)) {
                          s = (qi == 0 ? 1900 : 1700);
                      } else {
                          String[] toks = meaningfulTokens(q);
                          int hit = 0;
                          for (String t : toks) if (hasToken(fileNorm, t)) hit++;

                          if (toks.length == 1) {
                              if (hit == 1) s = 1050;
                          } else if (toks.length >= 2) {
                              double ratio = (double) hit / (double) toks.length;
                              if (hit >= 2 && ratio >= 0.67) s = 850 + hit * 150;
                              else if (hit == toks.length && hit > 0) s = 1100 + hit * 120;
                          }
                      }

                      if (s > 0) {
                          s -= Math.min(180, Math.abs(fileNorm.length() - q.length()) / 2);
                          if (qi == 0) s += 80; // canonical English title gets priority
                      }
                      if (s > bestBase) bestBase = s;
                  }

                  // Critical V7 rule: unrelated files are rejected. V6 could add the Arabic bonus to a zero title
                  // score, which allowed the same unrelated SRT to be selected for different movies.
                  if (bestBase < 700) return 0;

                  int bonus = 0;
                  String low = rawName.toLowerCase(Locale.ROOT);
                  if (low.contains("arab") || low.contains("arabic") || low.contains("_ar") ||
                      low.contains(".ar.") || low.contains("[ar]") || low.contains("عربي")) bonus += 160;
                  return bestBase + bonus;
              }

              private static boolean containsPhrase(String text, String phrase) {
                  if (empty(text) || empty(phrase)) return false;
                  if (text.equals(phrase)) return true;
                  return (" " + text + " ").contains(" " + phrase + " ");
              }

              private static boolean hasToken(String text, String token) {
                  if (empty(text) || empty(token)) return false;
                  return (" " + text + " ").contains(" " + token + " ");
              }

              private static String[] meaningfulTokens(String q) {
                  if (empty(q)) return new String[0];
                  String[] all = q.split("\\s+");
                  ArrayList<String> keep = new ArrayList<>();
                  for (String t : all) {
                      if (t.length() < 2) continue;
                      if (t.equals("the") || t.equals("a") || t.equals("an") || t.equals("and") ||
                          t.equals("of") || t.equals("in") || t.equals("on") || t.equals("part")) continue;
                      keep.add(t);
                  }
                  return keep.toArray(new String[0]);
              }

              private static String archiveUrl(String name) throws Exception {
                  String e = URLEncoder.encode(name, "UTF-8").replace("+", "%20")
                          .replace("%28", "(").replace("%29", ")")
                          .replace("%5B", "[").replace("%5D", "]");
                  return "https://archive.org/download/mora.25r/" + e;
              }

              private static String[] tokens(String q) {
                  if (empty(q)) return new String[0];
                  return q.split("\\s+");
              }

              private static String norm(String s) {
                  if (s == null) return "";
                  String x = Normalizer.normalize(s, Normalizer.Form.NFD).replaceAll("\\p{M}+", "");
                  return x.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]+", " ").replaceAll("\\s+", " ").trim();
              }

              private static class SubtitleMatch {
                  final String fileName; final int score;
                  SubtitleMatch(String f, int s) { fileName=f; score=s; }
              }

              private static String get(String url, int connectTimeout, int readTimeout) throws Exception {
                  HttpURLConnection c = (HttpURLConnection)new URL(url).openConnection();
                  c.setConnectTimeout(connectTimeout); c.setReadTimeout(readTimeout); c.setRequestMethod("GET");
                  c.setRequestProperty("User-Agent", "SubtitleAutoFind/7 Android");
                  BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream()));
                  StringBuilder out = new StringBuilder(); String line;
                  while ((line = br.readLine()) != null) out.append(line).append('\n');
                  br.close(); c.disconnect(); return out.toString();
              }

              private static String enc(String s) throws Exception { return URLEncoder.encode(s, "UTF-8"); }

              private static String pick(String s, String... keys) {
                  if (s == null) return null;
                  for (String k : keys) {
                      String q = Pattern.quote(k);
                      Pattern[] ps = new Pattern[] {
                          Pattern.compile("(?is)<"+q+">\\s*([^<]+?)\\s*</"+q+">") ,
                          Pattern.compile("(?is)\\b"+q+"\\s*=\\s*[\"']?([^\"'&<>\\s]+)"),
                          Pattern.compile("(?is)[\"']"+q+"[\"']\\s*:\\s*[\"']?([^\"',}]+)")
                      };
                      for (Pattern p : ps) { Matcher m=p.matcher(s); if (m.find()) return m.group(1).trim(); }
                  }
                  return null;
              }

              private static String extractTitle(String s) {
                  if (s == null) return null;
                  String[] keys = {"epgName","programName","programmeName","event_name","eventName","title","name"};
                  for (String k : keys) {
                      String v = pick(s,k);
                      if (!empty(v) && v.length() > 1 && !v.matches("(?i)(epg|event|channel|current)")) return html(v);
                  }
                  return null;
              }

              private static String cleanTitle(String s) {
                  s = html(s).replaceAll("(?i)\\b(HD|FHD|UHD|4K)\\b", " ");
                  s = s.replaceAll("(?i)\\s*[\\(\\[]?(19|20)\\d{2}[\\)\\]]?\\s*$", " ");
                  return s.replaceAll("\\s+", " ").trim();
              }

              private static String firstNonEmpty(String... values) {
                  if (values == null) return "";
                  for (String v : values) if (!empty(v)) return v.trim();
                  return "";
              }

              // Stage 1: resolve a localized title through Wikidata aliases/labels.
              private static String resolveViaWikidata(String title) {
                  String[] langs = {
                      "en","pl","fr","de","es","it","pt","ro","cs","sk","hu","tr","uk","ru","ar",
                      "nl","sv","no","da","fi","el","bg","sr","hr","sl","lt","lv","et","he","fa","id"
                  };
                  try {
                      for (String lang : langs) {
                          String u = "https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&limit=8&type=item&language="
                                  + lang + "&search=" + enc(title);
                          JSONObject obj = new JSONObject(get(u, 6000, 9000));
                          JSONArray arr = obj.optJSONArray("search");
                          if (arr == null || arr.length() == 0) continue;

                          String candidateId = null;
                          for (int i=0;i<arr.length();i++) {
                              JSONObject x = arr.optJSONObject(i);
                              if (x == null) continue;
                              String desc = x.optString("description", "").toLowerCase(Locale.ROOT);
                              if (desc.contains("film") || desc.contains("movie") || desc.contains("television") ||
                                  desc.contains("series") || desc.contains("serial") || desc.contains("película") ||
                                  desc.contains("filme") || desc.contains("фильм") || desc.contains("фільм") ||
                                  desc.contains("فيلم") || desc.contains("مسلسل") || desc.contains("cinema")) {
                                  candidateId = x.optString("id", null);
                                  break;
                              }
                          }
                          if (candidateId == null) {
                              JSONObject first = arr.optJSONObject(0);
                              if (first != null) candidateId = first.optString("id", null);
                          }
                          if (candidateId == null || !candidateId.startsWith("Q")) continue;

                          String e = "https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&props=labels&languages=en&ids=" + enc(candidateId);
                          JSONObject ent = new JSONObject(get(e, 6000, 9000)).optJSONObject("entities");
                          if (ent == null) continue;
                          JSONObject item = ent.optJSONObject(candidateId);
                          if (item == null) continue;
                          JSONObject labels = item.optJSONObject("labels");
                          if (labels == null) continue;
                          JSONObject en = labels.optJSONObject("en");
                          if (en != null) {
                              String v = en.optString("value", "").trim();
                              if (!v.isEmpty() && v.length() < 150) return v;
                          }
                      }
                  } catch (Throwable ignored) {}
                  return "";
              }

              // Stage 2: translation fallback. If Wikidata has no alias for the EPG language,
              // translate the title instead of giving up.
              private static String translateToEnglish(String title) {
                  try {
                      String u = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=" + enc(title);
                      JSONArray root = new JSONArray(get(u, 6000, 9000));
                      JSONArray parts = root.optJSONArray(0);
                      if (parts == null) return "";
                      StringBuilder out = new StringBuilder();
                      for (int i=0;i<parts.length();i++) {
                          JSONArray part = parts.optJSONArray(i);
                          if (part == null) continue;
                          String t = part.optString(0, "");
                          if (!empty(t)) out.append(t);
                      }
                      String v = out.toString().trim();
                      return v.length() < 150 ? v : "";
                  } catch (Throwable ignored) {
                      return "";
                  }
              }

              // Stage 3: canonicalize the result against Cinemeta/IMDb-style metadata.
              // This avoids literal translations when the official English release title differs.
              private static String resolveViaCinemeta(String... queries) {
                  try {
                      if (queries == null) return "";
                      String bestName = "";
                      int bestScore = Integer.MIN_VALUE;
                      for (String q : queries) {
                          if (empty(q)) continue;
                          String nq = norm(q);
                          for (String type : new String[]{"movie","series"}) {
                              String pathQ = URLEncoder.encode(q, "UTF-8").replace("+", "%20");
                              String u = "https://v3-cinemeta.strem.io/catalog/" + type + "/top/search=" + pathQ + ".json";
                              JSONObject obj = new JSONObject(get(u, 6500, 10000));
                              JSONArray metas = obj.optJSONArray("metas");
                              if (metas == null) continue;
                              for (int i=0;i<Math.min(8, metas.length());i++) {
                                  JSONObject m = metas.optJSONObject(i);
                                  if (m == null) continue;
                                  String name = m.optString("name", "").trim();
                                  if (empty(name)) continue;
                                  String nn = norm(name);
                                  int sc = 0;
                                  if (nn.equals(nq)) sc += 1000;
                                  if (nn.contains(nq) || nq.contains(nn)) sc += 650;
                                  String[] toks = tokens(nq);
                                  int hit=0;
                                  for (String t : toks) if (t.length()>1 && nn.contains(t)) hit++;
                                  sc += hit * 90;
                                  sc -= Math.min(150, Math.abs(nn.length()-nq.length()));
                                  if (sc > bestScore) { bestScore=sc; bestName=name; }
                              }
                          }
                      }
                      return bestScore > 0 ? bestName : "";
                  } catch (Throwable ignored) {
                      return "";
                  }
              }

              private static long elapsedFromClockText(String text) {
                  if (empty(text)) return -1;
                  try {
                      Matcher m = Pattern.compile("(?<!\\d)([01]?\\d|2[0-3])[:.]([0-5]\\d)(?!\\d)").matcher(text);
                      if (!m.find()) return -1;
                      int hh = Integer.parseInt(m.group(1));
                      int mm = Integer.parseInt(m.group(2));
                      Calendar now = Calendar.getInstance();
                      Calendar start = (Calendar) now.clone();
                      start.set(Calendar.HOUR_OF_DAY, hh);
                      start.set(Calendar.MINUTE, mm);
                      start.set(Calendar.SECOND, 0);
                      start.set(Calendar.MILLISECOND, 0);
                      // A programme that began before midnight can still be on air after midnight.
                      if (start.getTimeInMillis() - now.getTimeInMillis() > 60L * 60L * 1000L) {
                          start.add(Calendar.DAY_OF_MONTH, -1);
                      }
                      long d = now.getTimeInMillis() - start.getTimeInMillis();
                      return d >= 0 && d < 8L * 60L * 60L * 1000L ? d : -1;
                  } catch (Throwable t) { return -1; }
              }

              private static String formatMs(long ms) {
                  if (ms < 0) return "--:--:--";
                  long sec = ms / 1000L;
                  return String.format(Locale.US, "%02d:%02d:%02d", sec/3600L, (sec/60L)%60L, sec%60L);
              }

              private static long extractElapsed(String epg) {
                  try {
                      String st = pick(epg,"startTime","start_time","starttime","epg_starttime");
                      return elapsedFromStartValue(st);
                  } catch(Exception e) { return -1; }
              }

              private static long elapsedFromStartValue(String st) {
                  if (empty(st)) return -1;
                  String v = st.trim();
                  long now = System.currentTimeMillis();
                  try {
                      if (v.matches("\\d{10}")) {
                          long d = now - Long.parseLong(v) * 1000L;
                          return validElapsed(d);
                      }
                      if (v.matches("\\d{13}")) {
                          long d = now - Long.parseLong(v);
                          return validElapsed(d);
                      }
                      if (v.matches("\\d{14}")) {
                          java.text.SimpleDateFormat f = new java.text.SimpleDateFormat("yyyyMMddHHmmss", Locale.US);
                          f.setLenient(false);
                          long d = now - f.parse(v).getTime();
                          return validElapsed(d);
                      }
                  } catch (Throwable ignored) {}

                  String[] formats = {
                      "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd-HH:mm:ss", "yyyy/MM/dd HH:mm:ss",
                      "yyyy-MM-dd HH:mm", "yyyy/MM/dd HH:mm"
                  };
                  for (String fmt : formats) {
                      try {
                          java.text.SimpleDateFormat f = new java.text.SimpleDateFormat(fmt, Locale.US);
                          f.setLenient(false);
                          long d = now - f.parse(v).getTime();
                          long ok = validElapsed(d);
                          if (ok >= 0) return ok;
                      } catch (Throwable ignored) {}
                  }

                  // Last fallback: EPG values such as "08:30", "08:30 - 10:45", etc.
                  return elapsedFromClockText(v);
              }

              private static long validElapsed(long d) {
                  return d >= 0 && d < 8L * 60L * 60L * 1000L ? d : -1;
              }

              private static String html(String s) {
                  if (s == null) return "";
                  return s.replace("&amp;","&").replace("&quot;","\\\"")
                          .replace("&#39;","'").replace("&lt;","<").replace("&gt;",">").trim();
              }

              private static boolean empty(String s) { return s == null || s.trim().isEmpty(); }
              private static String safe(String s) { return s == null ? "Unknown error" : s; }
              private void ui(String s) { runOnUiThread(() -> status.setText(s)); }
              private void fail(String s) { ui(s); }
          }
          EOF

          cat > app/src/main/java/com/subtitle/autofind/DtvAccessibilityService.java <<'EOF'
          package com.subtitle.autofind;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.ArrayDeque;
          import java.util.List;
          import java.util.Locale;

          public class DtvAccessibilityService extends AccessibilityService {
              private static final String DTV = "com.tiartoptv.dvb";

              @Override public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getPackageName() == null || !DTV.contentEquals(event.getPackageName())) return;
                  cacheDtvInfo();
              }

              private void cacheDtvInfo() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null || root.getPackageName() == null || !DTV.contentEquals(root.getPackageName())) return;

                  String title = textById(root, DTV + ":id/barEpgInfoNowTextView");
                  if (empty(title)) title = textById(root, DTV + ":id/barEpgInfoNowText");
                  if (empty(title)) title = findByIdWords(root, true, "epg", "now");
                  if (empty(title)) title = findByIdWords(root, true, "program", "name");
                  if (empty(title)) title = findByIdWords(root, true, "event", "name");

                  String channel = findByIdWords(root, false, "channel", "name");
                  if (empty(channel)) channel = findByIdWords(root, false, "service", "name");

                  String time = textById(root, DTV + ":id/barEpgInfoNowTime");
                  if (empty(time)) time = textById(root, DTV + ":id/barEpgInfoNowDuration");
                  if (empty(time)) time = findByIdWords(root, true, "epg", "now", "time");
                  if (empty(time)) time = findByIdWords(root, true, "program", "time");
                  if (empty(time)) time = findLikelyClockText(root);

                  android.content.SharedPreferences.Editor e = getSharedPreferences("auto", MODE_PRIVATE).edit();
                  if (!empty(title)) e.putString("last_dtv_title", clean(title));
                  if (!empty(channel)) e.putString("last_dtv_channel", clean(channel));
                  if (!empty(time)) e.putString("last_dtv_time", clean(time));
                  if (!empty(title) || !empty(channel) || !empty(time)) e.putLong("last_dtv_seen", System.currentTimeMillis());
                  e.apply();
              }

              private String findLikelyClockText(AccessibilityNodeInfo root) {
                  ArrayDeque<AccessibilityNodeInfo> q = new ArrayDeque<>(); q.add(root);
                  java.util.regex.Pattern p = java.util.regex.Pattern.compile(".*(?:[01]?\\d|2[0-3])[:.]([0-5]\\d).*");
                  while (!q.isEmpty()) {
                      AccessibilityNodeInfo n = q.remove();
                      String t = nodeText(n);
                      if (!empty(t) && t.length() < 80 && p.matcher(t).matches()) return t;
                      for (int i=0;i<n.getChildCount();i++) { AccessibilityNodeInfo c=n.getChild(i); if(c!=null) q.add(c); }
                  }
                  return null;
              }

              private String textById(AccessibilityNodeInfo root, String id) {
                  try {
                      List<AccessibilityNodeInfo> list = root.findAccessibilityNodeInfosByViewId(id);
                      if (list != null) for (AccessibilityNodeInfo n : list) {
                          String t = nodeText(n); if (!empty(t)) return t;
                      }
                  } catch (Throwable ignored) {}
                  return null;
              }

              private String findByIdWords(AccessibilityNodeInfo root, boolean preferLong, String... words) {
                  ArrayDeque<AccessibilityNodeInfo> q = new ArrayDeque<>(); q.add(root);
                  String best = null;
                  while (!q.isEmpty()) {
                      AccessibilityNodeInfo n = q.remove();
                      String id = n.getViewIdResourceName();
                      if (id != null) {
                          String z = id.toLowerCase(Locale.ROOT);
                          boolean ok = true;
                          for (String w : words) if (!z.contains(w)) { ok = false; break; }
                          if (ok) {
                              String t = nodeText(n);
                              if (!empty(t) && (!preferLong || best == null || t.length() > best.length())) best = t;
                          }
                      }
                      for (int i=0;i<n.getChildCount();i++) { AccessibilityNodeInfo c=n.getChild(i); if(c!=null) q.add(c); }
                  }
                  return best;
              }

              private static String nodeText(AccessibilityNodeInfo n) {
                  if (n == null) return null;
                  CharSequence t = n.getText();
                  if (t != null && t.toString().trim().length() > 0) return t.toString().trim();
                  CharSequence d = n.getContentDescription();
                  if (d != null && d.toString().trim().length() > 0) return d.toString().trim();
                  return null;
              }

              private static boolean empty(String s) { return s == null || s.trim().isEmpty(); }
              private static String clean(String s) { return s == null ? null : s.replaceAll("\\s+", " ").trim(); }
              @Override public void onInterrupt() {}
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          curl -L --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build debug APK
        shell: bash
        run: |
          ./gradle-8.7/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SubtitleAutoFind-v7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleAutoFind-v7-apk
          path: SubtitleAutoFind-v7.apk
          if-no-files-found: error
